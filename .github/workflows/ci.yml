name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - id: format
        run: npm run format:check

      - name: Show formatting diff
        if: failure() && steps.format.outcome == 'failure'
        run: |
          npx prettier --write .
          git diff --exit-code || true

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser matrix
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

      - name: Upload portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-screenshots-${{ github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit portfolio screenshots once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'MykolaDotsenko'
        shell: bash
        run: |
          mkdir -p /tmp/pizzeria-screenshots
          cp docs/screenshots/pizzeria-desktop.png /tmp/pizzeria-screenshots/
          cp docs/screenshots/pizzeria-mobile.png /tmp/pizzeria-screenshots/

          git fetch --depth=1 origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"

          if git ls-files --error-unmatch docs/screenshots/pizzeria-desktop.png >/dev/null 2>&1; then
            echo "Portfolio screenshots are already tracked."
            exit 0
          fi

          mkdir -p docs/screenshots
          cp /tmp/pizzeria-screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/pizzeria-desktop.png docs/screenshots/pizzeria-mobile.png
          git commit -m "docs: add generated portfolio screenshots"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
